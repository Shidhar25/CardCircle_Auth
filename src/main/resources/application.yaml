spring:
  application:
    name: CardCircle

  datasource:
    url: jdbc:mysql://localhost:3306/cardcircle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

app:
  jwt:
    secret: cardcircle-cardcircle-cardcircle-cardcircle-cardcircle-cardcircle
    expiration-ms: 86400000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE